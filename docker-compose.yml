services:
  classifier:
    build: .
    image: microbatch-classifier:latest
    ports:
      - "8000:8000"
    environment:
      # Spec limits (defaults already match the spec):
      MAX_CAPACITY: "16"      # max images queued or computing
      BATCH_SIZE: "4"         # max images per batch
      BATCH_WAIT_MS: "50"     # idle model waits at most 50 ms to fill a batch
      # Demo knob: simulate slow inference (ms). Submit/query/cancel stay
      # responsive regardless. Set e.g. "2000" to see the effect.
      INFERENCE_DELAY_MS: "0"
      # Receipt retention: settled orders (done/failed/cancelled/expired, no
      # longer occupying queue or compute) stay queryable for 60 s, at most
      # 128 receipts (oldest-settled evicted first), reclaimed in the
      # background every second even without traffic. Evicted => 404.
      RECEIPT_TTL_MS: "60000"
      RECEIPT_MAX: "128"
      SWEEP_INTERVAL_MS: "1000"
    restart: unless-stopped
